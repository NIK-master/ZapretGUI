<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Zapret for ADHD</title>
				<script src="https://cdn.tailwindcss.com"></script>
				<!-- Модульные таблицы стилей -->
				<link rel="stylesheet" href="css/base.css">
					<link rel="stylesheet" href="css/home-wizard.css">
						<link rel="stylesheet" href="css/views-modals.css">
</head>
	<body class="h-screen w-screen flex flex-col rounded-xl border border-[#2A2A2A] overflow-hidden bg-[#0A0A0A]">

		<!-- 1. ЗАСТАВКА И МАСТЕР ПЕРВОНАЧАЛЬНОЙ НАСТРОЙКИ 2.0 -->
		<!-- @include partials/splash-wizard.html -->

		<!-- 2. ШАПКА ОКНА (TITLE BAR) -->
		<header id="titlebar" class="h-[45px] bg-[#121212] border-b border-[#2A2A2A] flex items-center justify-between pr-2.5 shrink-0 cursor-move">
			<div class="flex items-center">
				<button onclick="toggleSidebar()" class="w-[45px] h-[45px] flex items-center justify-center text-white hover:bg-[#1F1F1F] transition cursor-pointer">
					<span class="mdl-icon text-base">&#xE700;</span>
				</button>

				<div class="flex items-center gap-5 ml-2.5 pointer-events-none">
					<div class="flex items-center gap-2">
						<span class="font-semibold text-sm text-[#888888]">Zapret for ADHD</span>
						<span class="app-ver-text text-[11px] font-mono text-[#666666] bg-[#1A1A1A] border border-[#2A2A2A] px-1.5 py-0.5 rounded">v4.1</span>
					</div>

					<div class="flex items-center gap-4 text-xs text-[#888888]">
						<div class="flex items-center gap-1.5">
							<span id="dot-net" class="w-2 h-2 rounded-full dot-online"></span>
							<span>Сеть</span>
						</div>
						<div class="flex items-center gap-1.5">
							<span id="dot-zapret" class="w-2 h-2 rounded-full dot-offline"></span>
							<span>Zapret</span>
						</div>
						<div class="flex items-center gap-1.5">
							<span id="dot-proxy" class="w-2 h-2 rounded-full dot-offline"></span>
							<span>TgWsProxy</span>
						</div>
					</div>
				</div>
			</div>

			<div class="flex items-center gap-1.5">
				<button onclick="openCommandPalette()" class="px-2.5 h-[26px] mr-1 rounded-md bg-[#1A1A1A] hover:bg-[#242424] border border-[#2C2C2C] text-[11px] font-mono text-[#999999] hover:text-white transition flex items-center gap-2 cursor-pointer" title="Быстрая палитра команд (Ctrl + K)">
					<span class="mdl-icon text-[10px] text-brand">&#xE721;</span>
					<span>Команды</span>
					<kbd class="px-1 py-0.2 rounded bg-[#111111] border border-[#333333] text-[9.5px] text-[#777777]">Ctrl+K</kbd>
				</button>
				<button onclick="sendCmd('windowMinimize')" class="w-[35px] h-[30px] rounded hover:bg-[#222222] text-white transition flex items-center justify-center cursor-pointer">—</button>
				<button onclick="sendCmd('windowClose')" class="w-[35px] h-[30px] rounded hover:bg-[#222222] text-[#D13438] transition flex items-center justify-center cursor-pointer">✕</button>
			</div>
		</header>

		<!-- 3. ОСНОВНОЙ КОНТЕЙНЕР -->
		<div class="flex flex-1 overflow-hidden relative">

			<!-- БОКОВОЕ МЕНЮ (SIDEBAR) -->
			<aside id="sidebar" class="w-[220px] bg-[#181818] border-r border-[#2A2A2A] px-2.5 pt-5 pb-3 flex flex-col justify-between shrink-0 transition-all duration-200 overflow-hidden">
				<nav id="sidebar-nav" class="relative flex flex-col gap-2.5 w-[200px]">
					<div id="sidebar-active-pill" class="sidebar-sliding-pill"></div>

					<button onclick="switchTab('home', this)" title="Главная" class="nav-btn active relative z-10 flex items-center gap-3 px-4 h-[40px] rounded-md text-sm font-semibold text-white transition-colors cursor-pointer">
						<span class="mdl-icon text-sm text-[#4CAF50] transition-colors">&#xE80F;</span>
						<span>Главная</span>
					</button>
					<button onclick="switchTab('mods', this)" title="Модификации" class="nav-btn relative z-10 flex items-center gap-3 px-4 h-[40px] rounded-md text-sm font-medium text-[#CCCCCC] hover:text-white transition-colors cursor-pointer">
						<span class="mdl-icon text-sm text-[#888888] transition-colors">&#xE74C;</span>
						<span>Модификации</span>
					</button>
					<button onclick="switchTab('diag', this)" title="Диагностика" class="nav-btn relative z-10 flex items-center gap-3 px-4 h-[40px] rounded-md text-sm font-medium text-[#CCCCCC] hover:text-white transition-colors cursor-pointer">
						<span class="mdl-icon text-sm text-[#888888] transition-colors">&#xE9D9;</span>
						<span>Диагностика</span>
					</button>
					<button onclick="switchTab('settings', this)" title="Настройки" class="nav-btn relative z-10 flex items-center gap-3 px-4 h-[40px] rounded-md text-sm font-medium text-[#CCCCCC] hover:text-white transition-colors cursor-pointer">
						<span class="mdl-icon text-sm text-[#888888] transition-colors">&#xE713;</span>
						<span>Настройки</span>
					</button>
				</nav>

				<div id="sidebar-footer" class="text-center text-[11px] text-[#555555] font-mono pb-1 whitespace-nowrap">
					Zapret for ADHD <span id="app-version" class="app-ver-text">v4.1</span>
				</div>
			</aside>

			<!-- ГЛАВНАЯ ОБЛАСТЬ ВКЛАДОК -->
			<main id="main-container" class="flex-1 p-5 overflow-y-auto relative bg-[#121212]">
				<!-- @include partials/tab-home.html -->
				<!-- @include partials/tab-mods.html -->
				<!-- @include partials/tab-diag.html -->
				<!-- @include partials/tab-settings.html -->
			</main>

			<!-- МОДАЛЬНЫЕ ОКНА И ОВЕРЛЕИ -->
			<!-- @include partials/modals.html -->
		</div>

		<!-- ПОДКЛЮЧЕНИЕ МОДУЛЬНЫХ СКРИПТОВ -->
		<script src="js/settings.js"></script>
		<script src="js/mods.js"></script>
		<script src="js/diagnostics.js"></script>
		<script src="js/splash-wizard.js"></script>
		<script src="js/home-configs.js"></script>
		<script src="js/palette.js"></script>
		<script src="js/radar.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
